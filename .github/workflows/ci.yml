name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, type-check, and unit-test against BOTH Express 4 and Express 5 to guarantee
  # the Express adapter stays seamless across both majors. The peer-dependency range is
  # `^4.17.0 || ^5.0.0`; this matrix is what keeps that promise honest.
  test:
    name: test (express ${{ matrix.express }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        express: [4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repo pins Express 5 as a dev dependency; for the v4 leg of the matrix we
      # swap in Express 4 (and its matching @types) so the suite exercises that major.
      # peerDependencies already allow both, so this only changes which version is resolved.
      - name: Pin Express ${{ matrix.express }}
        if: matrix.express == 4
        run: pnpm add -D express@4 @types/express@4

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:unit

  # Full-stack integration tests against a real PostgreSQL: every HTTP adapter (Express,
  # Fastify, HyperExpress, Ultimate Express) is exercised end-to-end through PrismaAdapter.
  # `globalSetup` runs `prisma generate` + `prisma db push` against the service container
  # before any test executes.
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halifax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `test:integration` loads DATABASE_URL from .env.test via dotenv-cli.
      - name: Write .env.test
        run: echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/halifax_test"' > .env.test

      - name: Integration tests
        run: pnpm run test:integration
