name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, type-check, and unit-test against BOTH Express 4 and Express 5 to guarantee
  # the Express adapter stays seamless across both majors. The peer-dependency range is
  # `^4.17.0 || ^5.0.0`; this matrix is what keeps that promise honest.
  test:
    name: test (express ${{ matrix.express }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        express: [4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repo pins Express 5 as a dev dependency; for the v4 leg of the matrix we
      # swap in Express 4 (and its matching @types) so the suite exercises that major.
      # peerDependencies already allow both, so this only changes which version is resolved.
      # `pnpm add` re-resolves the tree and (unlike `pnpm install`) does not read the
      # .npmrc `block-exotic-subdeps` setting, so pass it explicitly — the uWebSockets.js
      # git sub-dep of hyper-express / ultimate-express would otherwise abort the install.
      - name: Pin Express ${{ matrix.express }}
        if: matrix.express == 4
        run: pnpm add -D express@4 @types/express@4 --config.block-exotic-subdeps=false

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:unit

  # Full-stack integration tests against REAL databases, one matrix leg per engine. The same
  # 147-test suite (every HTTP adapter × PrismaAdapter, query builder, tenant scoping) runs
  # unchanged on each — proof that compiling the query AST to portable Prisma Client calls is
  # genuinely database-agnostic. `HALIFAX_DB` selects the schema + driver adapter; globalSetup
  # runs `prisma generate` + `prisma db push` before any test executes.
  #
  # Every relational engine the library supports runs here against a real container, brought up
  # from the same docker-compose.test.yml used locally (so CI and local runs stay identical —
  # and so CockroachDB's custom start command, which GitHub `services:` can't express, works).
  # scripts/integration-matrix.sh owns the per-engine DATABASE_URL. MongoDB is intentionally
  # absent: Prisma 7 dropped MongoDB support (coming soon in v7) — the harness is forward-ready.
  integration:
    name: integration (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, mariadb, mssql, cockroachdb, sqlite]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Start this leg's database (plus Redis, shared by every leg's cache test) from the same
      # compose file used locally. SQLite is embedded, so it only needs Redis. `--wait` blocks
      # until each container reports healthy.
      - name: Start test databases
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            docker compose -f docker-compose.test.yml up -d --wait redis
          else
            docker compose -f docker-compose.test.yml up -d --wait redis "${{ matrix.db }}"
          fi

      # Type-check the runnable example against the generated client (keeps it from drifting).
      - name: Type-check examples
        if: matrix.db == 'postgres'
        run: |
          pnpm exec prisma generate --schema=tests/integration/prisma/schema.prisma
          pnpm exec tsc --noEmit -p examples/tsconfig.json

      - name: Integration tests (${{ matrix.db }})
        run: bash scripts/integration-matrix.sh ${{ matrix.db }}
