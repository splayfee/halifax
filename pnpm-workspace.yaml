packages:
  - 'packages/*'
# ultimate-express and hyper-express depend on uWebSockets.js (git-only, not on npm registry).
blockExoticSubdeps: false
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.3'
  - better-sqlite3@12.10.1
  - graphql@17.0.0
onlyBuiltDependencies:
  - esbuild
  - prisma
  - '@prisma/engines'
  - better-sqlite3
