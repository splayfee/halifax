# Local integration-test databases — one container per supported engine.
#
# Brings up every database the integration suite runs against (SQLite is embedded, so it
# has no container). Credentials are intentionally simple/throwaway — these are ephemeral
# test containers, never production. Host ports are distinct so the whole set can run at once.
#
#   docker compose -f docker-compose.test.yml up -d
#   pnpm test:integration:all          # runs the suite against every engine
#   docker compose -f docker-compose.test.yml down -v
#
# Per-engine DATABASE_URL / HALIFAX_DB values live in scripts/integration-matrix.sh.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halifax_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: halifax_test
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -proot']
      interval: 5s
      timeout: 5s
      retries: 15

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: halifax_test
    # Distinct host port so MySQL and MariaDB can run simultaneously.
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh --connect --innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      # SQL Server enforces password complexity: 8+ chars with upper, lower, digit, symbol.
      MSSQL_SA_PASSWORD: 'Halifax_test1'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Halifax_test1" -No -Q "SELECT 1" || exit 1'
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.3
    restart: unless-stopped
    # Insecure single-node cluster — root, no password. Fine for throwaway test data.
    command: start-single-node --insecure
    ports:
      - '26257:26257'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/health?ready=1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # MongoDB is disabled until Prisma 7 supports it again (it was dropped in v7, "coming soon").
  # The service below is correct and ready (single-node replica set, which Prisma's connector
  # requires); uncomment it — and re-add `mongodb` to scripts/integration-matrix.sh and CI —
  # once Prisma 7 ships MongoDB support.
  #
  # mongodb:
  #   image: mongo:7
  #   command: ['--replSet', 'rs0', '--bind_ip_all']
  #   ports:
  #     - '27017:27017'
  #   healthcheck:
  #     test:
  #       [
  #         'CMD-SHELL',
  #         "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"
  #       ]
  #     interval: 5s
  #     timeout: 10s
  #     retries: 30
  #     start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
